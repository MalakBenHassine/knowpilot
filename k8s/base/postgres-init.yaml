# GENERATED by infra/postgres/init-configmap.py - do not edit.
#
# The same scripts the Compose stack bind-mounts into PostgreSQL
# (infra/postgres/init/). They run once, on an empty data directory: they
# create Keycloak's own database and user inside the same server, revoke the
# CONNECT that PostgreSQL grants to PUBLIC by default, and enable pgvector in
# the application database only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-create-keycloak-db.sh: |
    #!/bin/bash
    # Runs once, the first time the postgres volume is created.
    # Keycloak gets its OWN database and its OWN user inside the same instance:
    # one server, two isolated tenants. If the Keycloak user leaks, it must not be
    # able to read the application data.
    set -euo pipefail

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE USER "$KP_KEYCLOAK_DB_USER" WITH PASSWORD '$KP_KEYCLOAK_DB_PASSWORD';
        CREATE DATABASE "$KP_KEYCLOAK_DB" OWNER "$KP_KEYCLOAK_DB_USER";

        -- PostgreSQL grants CONNECT to PUBLIC by default, so ANY user can open
        -- ANY database. Least privilege: revoke it, then grant explicitly.
        REVOKE CONNECT ON DATABASE "$POSTGRES_DB" FROM PUBLIC;
        GRANT CONNECT ON DATABASE "$POSTGRES_DB" TO "$POSTGRES_USER";

        REVOKE CONNECT ON DATABASE "$KP_KEYCLOAK_DB" FROM PUBLIC;
        GRANT CONNECT ON DATABASE "$KP_KEYCLOAK_DB" TO "$KP_KEYCLOAK_DB_USER";
    EOSQL

    echo "Keycloak database '$KP_KEYCLOAK_DB' created and isolated."
  02-enable-pgvector.sh: |
    #!/usr/bin/env bash
    # Activates pgvector in the application database.
    #
    # Runs once, on an empty data directory, like 01-create-keycloak-db.sh. The
    # extension binaries ship with the pgvector/pgvector image; this only turns it
    # on for our database. Keycloak's database has no use for it, and enabling an
    # extension it does not need would widen its surface for nothing.
    #
    # Init scripts only run on an empty data directory, so an existing volume
    # has to be recreated for this to take effect.
    set -euo pipefail

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-'SQL'
        CREATE EXTENSION IF NOT EXISTS vector;
    SQL

    echo "pgvector enabled in database $POSTGRES_DB"
