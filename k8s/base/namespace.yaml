apiVersion: v1
kind: Namespace
metadata:
  name: knowpilot
  labels:
    app.kubernetes.io/name: knowpilot
    # Pod Security Admission, enforced by the API server itself rather than by
    # a policy engine nobody installed. `restricted` refuses a pod that runs
    # as root, that can escalate privileges, or that keeps a capability - so
    # a manifest that forgets its securityContext is rejected at apply time,
    # not discovered in production.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
