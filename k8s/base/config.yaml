# Everything that is not a secret. The same KP_ variables the Compose stack
# uses (backend/app/core/config.py), so one settings object serves both.
apiVersion: v1
kind: ConfigMap
metadata:
  name: knowpilot-config
data:
  # local, not production: the production validator refuses to start without
  # https URLs (app/core/config.py), and this cluster serves the demo over
  # http://knowpilot.localhost. The production path is the Compose stack of
  # ADR-0020, where that validator is exercised for real.
  KP_ENVIRONMENT: local
  KP_LOG_LEVEL: INFO

  KP_POSTGRES_HOST: postgres
  KP_POSTGRES_PORT: "5432"
  KP_POSTGRES_USER: knowpilot
  KP_POSTGRES_DB: knowpilot

  # Keycloak gets its OWN database and its OWN user inside the same
  # server: one instance, two isolated tenants. If the Keycloak user
  # leaks, it still cannot read a single document.
  KP_KEYCLOAK_DB: keycloak
  KP_KEYCLOAK_DB_USER: keycloak

  # The weights are mounted read-only from a volume the model Job filled, and
  # HF_HUB_OFFLINE stops the library from reaching for the network to check
  # for a newer revision - which it would do on every start, and which would
  # fail on a pod with no egress.
  KP_EMBEDDING_CACHE_DIR: /models
  HF_HUB_OFFLINE: "1"
  # transformers converts PyTorch weights to safetensors in a background
  # thread unless told not to. It downloads 2.2 GB a second time to do it.
  DISABLE_SAFETENSORS_CONVERSION: "1"

  # The setting is `upload_root`, not `upload_dir`: the name has to match
  # app/core/config.py exactly, or the value is silently ignored and uploads
  # land in the default path - inside the container, on a read-only
  # filesystem.
  KP_UPLOAD_ROOT: /data/uploads
  KP_WORKER_METRICS_PORT: "9100"

  # Used by the model Job to fetch the weights, and by both processes to
  # check that what they loaded is what they expected.
  KP_EMBEDDING_MODEL: BAAI/bge-m3

  # Where the browser reaches the product. Every redirect, every token issuer
  # and every link in the login pages is built from these, so they are the
  # values that change between a laptop and a server - and the reason this
  # ConfigMap is patched by the overlay rather than edited here.
  KP_FRONTEND_URL: http://knowpilot.localhost
  KP_OIDC_ISSUER: http://knowpilot.localhost/auth/realms/knowpilot
  KP_OIDC_CLIENT_ID: knowpilot-bff
  KP_KEYCLOAK_PUBLIC_URL: http://knowpilot.localhost/auth
---
# Keycloak's own configuration. Separate, because it is a different product
# with its own variable names, and mixing the two makes both harder to read.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  KC_DB: postgres
  KC_DB_URL_HOST: postgres
  KC_DB_USERNAME: keycloak
  KC_HTTP_ENABLED: "true"
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_HTTP_RELATIVE_PATH: /auth
