apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: knowpilot-frontend:local
          ports:
            - name: http
              containerPort: 8080
          # nginx writes its temporary files under /var/cache and its pid
          # under /var/run. With a read-only root filesystem both have to be
          # somewhere writable, and neither has to survive a restart.
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            # nginx creates /tmp/proxy_temp at startup and refuses to start
            # without it - a read-only root filesystem is not enough, the
            # directories it writes to have to exist and be writable.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  # Keycloak shares one database with itself; two versions of it writing at
  # once during a rollout is not worth the zero downtime on a single-instance
  # deployment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: knowpilot-keycloak:local
          # The image was built with `kc.sh build` already run, so this starts
          # an optimized distribution instead of re-augmenting Quarkus on
          # every boot.
          args: ["start", "--optimized"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: keycloak-config
          env:
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knowpilot-secrets
                  key: KP_KEYCLOAK_DB_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: knowpilot-secrets
                  key: KP_KEYCLOAK_ADMIN
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knowpilot-secrets
                  key: KP_KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: knowpilot-config
                  key: KP_KEYCLOAK_PUBLIC_URL
            - name: KC_DB_URL_DATABASE
              value: keycloak
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Keycloak builds a truststore under data/ on every start, even
            # with an external database and nothing to persist. Read-only
            # root, so it needs somewhere to put it; nothing in there has to
            # survive a restart.
            - name: data
              mountPath: /opt/keycloak/data
          # Keycloak serves its probes on a separate management port (9000)
          # so they are never exposed with the login pages. The paths carry
          # the /auth prefix because the management interface inherits
          # KC_HTTP_RELATIVE_PATH: /health/started is a 404, and only
          # /auth/health/started answers. Measured, after a startup probe
          # failed twenty-three times in a row against a Keycloak whose log
          # already said the bootstrap had completed.
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: 9000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: 9000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: 9000
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
