# Redis holds the BFF sessions and the ingestion queue. A StatefulSet for the
# same reason as PostgreSQL: the queue is state, and losing it loses uploads
# that were accepted and acknowledged.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
          # A password even inside the cluster: a NetworkPolicy is a rule, and
          # a rule can be edited by anyone who can edit manifests. The
          # password is the second lock. `noeviction` because this holds a job
          # queue - a queue that silently drops jobs under memory pressure
          # loses the uploads it exists to protect.
          command:
            - sh
            - -c
            - >-
              exec redis-server
              --requirepass "$REDIS_PASSWORD"
              --save 60 1
              --loglevel warning
              --maxmemory 256mb
              --maxmemory-policy noeviction
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knowpilot-secrets
                  key: KP_REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 320Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
