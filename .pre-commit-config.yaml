# Hooks exécutés automatiquement avant chaque commit.
# Installation locale (une fois par clone) : pre-commit install
# Exécution manuelle sur tout le dépôt      : pre-commit run --all-files

repos:
  # Détection de secrets : la protection la plus importante sur un dépôt public.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (détection de secrets)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false

  # Qualité du code Python (backend). Les outils viennent de l'environnement uv
  # du backend : même version en local et en CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint Python)
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff (format Python)
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: mypy
        name: mypy (typage strict)
        entry: bash -c 'cd backend && uv run mypy app'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

  # Garde-fous génériques maintenus par l'équipe pre-commit.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
        # Les manifests Kubernetes regroupent plusieurs objets dans un
        # meme fichier, separes par ---. Sans cette option le hook
        # s'arrete au deuxieme document.
        args: [--allow-multiple-documents]
      - id: check-json
        # Les fichiers tsconfig sont du JSONC (JSON avec commentaires) : exclus.
        exclude: ^frontend/tsconfig.*\.json$
      - id: end-of-file-fixer
      - id: trailing-whitespace
