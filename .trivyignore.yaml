# Vulnerabilities the release gate accepts, for now.
#
# An entry here is a DECISION, not a silence: it names the CVE, says why this
# deployment can carry it, and expires. On the expiry date Trivy reports it
# again and the release fails until someone looks - which is the point. A
# scanner whose findings can be switched off for good is a scanner nobody
# reads.
#
# Nothing in here may be a vulnerability in our own code or our own
# dependencies. Those are fixed, never ignored.

# Empty, and that is the whole point. Every entry this file ever carried was
# removed because the vulnerability was FIXED upstream and the fix adopted,
# never because it became inconvenient or because a date passed:
#
#   CVE-2025-59250   mssql-jdbc 13.2.1 -> 13.4.0    Keycloak 26.8.1
#   CVE-2026-8763    Bouncy Castle 1.84 -> 1.86     Keycloak 26.7.5
#   CVE-2026-13506   Bouncy Castle 1.84 -> 1.86     Keycloak 26.7.5
#   CVE-2026-68497   jackson-databind -> 2.21.7     Keycloak 26.7.5
#   CVE-2026-75595   Netty 4.1.136 -> 4.1.138       Keycloak 26.7.5
#   CVE-2026-84939   FreeMarker 2.3.32 -> 2.3.35    Keycloak 26.7.5
#
# Measured on the image this repository BUILDS, not on the one it starts from:
# `kc.sh build` keeps the drivers Keycloak ships, so the upstream scan is not
# the answer. The built image reports nothing HIGH or CRITICAL with a fix
# available, with this file empty.
vulnerabilities: []
