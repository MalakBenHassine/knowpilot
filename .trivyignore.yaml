# Vulnerabilities the release gate accepts, for now.
#
# An entry here is a DECISION, not a silence: it names the CVE, says why this
# deployment can carry it, and expires. On the expiry date Trivy reports it
# again and the release fails until someone looks - which is the point. A
# scanner whose findings can be switched off for good is a scanner nobody
# reads.
#
# Nothing in here may be a vulnerability in our own code or our own
# dependencies. Those are fixed, never ignored.

vulnerabilities:
  - id: CVE-2025-59250
    statement: >-
      Microsoft's JDBC driver, shipped inside the Keycloak distribution.
      KnowPilot runs Keycloak on PostgreSQL only (ADR-0020), and the image is
      built with `kc.sh build --db=postgres`, so this driver is never loaded.
      Removing the four unused database drivers from the image is the real
      fix and needs a start-up test first.
    expired_at: 2026-12-31

  - id: CVE-2026-8763
    statement: >-
      Bouncy Castle 1.84, inside the Keycloak distribution. Keycloak 26.7.4 is
      the latest release and still ships 1.84, so no version of Keycloak
      carries the fix today. Re-check when 26.8 is published.
    expired_at: 2026-12-31

  - id: CVE-2026-13506
    statement: >-
      Bouncy Castle 1.84, same distribution and same reason as CVE-2026-8763.
    expired_at: 2026-12-31

  - id: CVE-2026-68497
    statement: >-
      jackson-databind 2.21.5, inside the Keycloak distribution twice over: the
      server's own runtime jar, and again inside keycloak-admin-cli. A CPU
      denial of service through unbounded numeric parsing. Fixed upstream in
      2.21.6, and 26.7.4 is the newest Keycloak there is, so no distribution
      carries the fix today. `ignore-unfixed` does not catch this one precisely
      because the LIBRARY has a fix - what has no fix is the thing we deploy.
      NOT claimed unreachable. What bounds it is the edge and the protocol: the
      admin console and the master realm answer 404 in infra/caddy/Caddyfile,
      so an outsider reaches only the login and token endpoints, and those take
      form-encoded bodies rather than JSON. The JSON surface behind them -
      client registration, pushed authorization requests, the account API -
      needs a client secret or a session first. Caddy now caps the whole
      /auth/* route at 128 KB, which removes the cheap form of the attack: a
      megabyte-long numeric literal. The worst case left is CPU exhaustion on
      one VM - availability, with nothing read and nothing altered.
      This entry expires sooner than the others on purpose. Keycloak published
      four patch releases in ten weeks, so unlike Netty or FreeMarker below
      there is something to wait for.
    expired_at: 2026-11-30

  - id: CVE-2026-75595
    statement: >-
      Netty 4.1.136, inside the Keycloak distribution. Fixed upstream in
      4.1.137, which Keycloak has not shipped yet. Keycloak is not exposed
      directly: Caddy terminates TLS and is the only published container.
    expired_at: 2026-12-31

  - id: CVE-2026-84939
    statement: >-
      FreeMarker 2.3.32, inside the Keycloak distribution. Fixed upstream in
      2.3.35; Keycloak 26.7.4 is the latest release and still ships 2.3.32, so
      there is no version of Keycloak to upgrade to. Swapping the jar inside
      the image was considered and rejected: `kc.sh build` indexes the
      classpath during Quarkus augmentation, and shipping a login page that
      does not render is worse than this. NOT claimed unreachable - Keycloak
      renders its login pages with FreeMarker and the locale can be steered by
      a request parameter. What bounds it is what this container holds: the
      Keycloak distribution and nothing else. Every secret arrives as an
      environment variable (docker-compose.prod.yml), so reading a file in
      here exposes no credential. Remove this entry the day Keycloak ships
      FreeMarker 2.3.35 or later.
    expired_at: 2026-12-31
