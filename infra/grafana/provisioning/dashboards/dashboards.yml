# Dashboards come from files in the image, not from the database. Editing one
# in the interface is allowed and useful while exploring, but the file wins on
# every restart - so a dashboard that matters is one that was committed.
apiVersion: 1

providers:
  - name: knowpilot
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
