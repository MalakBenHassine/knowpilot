# What Prometheus scrapes, and how often (ADR-0021).
#
# Two targets, because KnowPilot is two processes that fail independently:
# the API serves its own /metrics, and the worker opens a second exporter
# (app/worker.py). An API answering every request while the worker is dead
# looks perfectly healthy from the outside and indexes nothing.
#
# Both live on the `backend` network, which has no route to the internet.
# Prometheus is never published: reaching it means an SSH tunnel to the
# server (docs/deploy.md).

global:
  # Fifteen seconds is the usual compromise: fine enough to see a spike,
  # coarse enough that a year of data stays small on one VM.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: knowpilot

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # The API. `/metrics` is served outside /api on purpose, so the reverse
  # proxy never exposes it to the internet.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # The worker. No HTTP server of its own, so prometheus_client opens one.
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  # Prometheus watching itself: if this target is down, nothing else in this
  # file can be trusted either.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
