; Copy to inventory.ini and put your own host in it. inventory.ini is
; git-ignored: an address and a user name are not secrets, but they are not
; everybody's business either.
;
;   cp inventory.example.ini inventory.ini
;   ansible-playbook site.yml --check     # change nothing, say what would change
;   ansible-playbook site.yml
;
; A VMware or VirtualBox guest on NAT is reachable from the host it runs on;
; find its address with `ip -4 addr` inside the guest.

[knowpilot]
vm ansible_host=192.168.x.x ansible_user=malek

[knowpilot:vars]
; Ask for the sudo password rather than storing it: add --ask-become-pass,
; or set this if the account has passwordless sudo.
; ansible_become_password=
