# Defaults so the command line stays short and the output stays readable.
[defaults]
inventory = inventory.ini
roles_path = roles
# The yaml callback lives in a collection now; the default is fine and
# keeps this playbook runnable with nothing but ansible-core.
# A provisioning run should say what it changed, not scroll.
display_skipped_hosts = false
host_key_checking = true
interpreter_python = auto_silent

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
# One SSH connection reused for the whole run instead of one per task. On a
# playbook of twenty-six tasks that is twenty-six handshakes saved, and the
# passphrase is asked for at most once either way.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30
# Send the module over the existing connection instead of copying a file and
# executing it. Needs no requiretty on the target, which Ubuntu does not set.
pipelining = True
