# Defaults so the command line stays short and the output stays readable.
[defaults]
inventory = inventory.ini
roles_path = roles
# The yaml callback lives in a collection now; the default is fine and
# keeps this playbook runnable with nothing but ansible-core.
# A provisioning run should say what it changed, not scroll.
display_skipped_hosts = false
host_key_checking = true
interpreter_python = auto_silent

[privilege_escalation]
become = true
become_method = sudo
