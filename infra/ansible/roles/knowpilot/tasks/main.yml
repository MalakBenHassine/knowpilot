---
# cosign, the configuration, and the timer that deploys.

- name: Download cosign
  ansible.builtin.get_url:
    url: >-
      https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign-linux-amd64
    dest: /usr/local/bin/cosign
    # Pinned by checksum, not by tag. A release asset can be replaced; a
    # sha256 cannot, and this binary is what decides whether an image is
    # allowed to run here.
    checksum: "sha256:{{ cosign_sha256 }}"
    mode: "0755"
  when: ansible_facts['architecture'] == "x86_64"
  # 156 MB over someone else's network. Seen for real: a truncated read at
  # 154 759 765 of 156 288 179 bytes. A lost packet is not a reason to abandon
  # a provisioning run, and the checksum above means a retry cannot smuggle in
  # a partial or different binary.
  register: knowpilot_cosign
  until: knowpilot_cosign is succeeded
  retries: 3
  delay: 5

- name: Refuse to guess on another architecture
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == "x86_64"
    fail_msg: >-
      This role pins the x86_64 cosign checksum only. Add the arm64 one
      before running it on {{ ansible_facts['architecture'] }} - an unpinned download
      is the one thing this whole chain exists to avoid.

- name: Create the production configuration from the example
  ansible.builtin.copy:
    src: "{{ knowpilot_directory }}/.env.production.example"
    dest: "{{ knowpilot_directory }}/.env.production"
    remote_src: true
    mode: "0600"
    # Never overwrite: the passwords already in it are the ones PostgreSQL
    # and Keycloak store. Replacing them locks the stack out of its own data.
    force: false

# Generated ON THE TARGET, so no password is ever templated from the control
# machine, written to this repository, or printed in an Ansible log.
- name: Generate every empty password and secret
  ansible.builtin.command: "{{ knowpilot_directory }}/infra/server/fill-secrets.sh .env.production"
  args:
    chdir: "{{ knowpilot_directory }}"
  register: knowpilot_secrets
  changed_when: "'0 generated' not in knowpilot_secrets.stdout"
  # The script prints counts, never values - but say so anyway.
  no_log: false

- name: Point the stack at this host and at the published images
  ansible.builtin.lineinfile:
    path: "{{ knowpilot_directory }}/.env.production"
    regexp: "^#? *{{ item.key }}="
    # Quoted, because these scripts `source` this file and a value with a
    # space breaks that: KP_TLS=tls internal made bash read KP_TLS=tls as an
    # environment prefix and try to run `internal` as a command. Compose
    # strips the quotes, verified on this version.
    line: '{{ item.key }}="{{ item.value }}"'
    mode: "0600"
  loop:
    - {key: KP_IMAGE_REGISTRY, value: "{{ knowpilot_registry }}"}
    - {key: KP_DOMAIN, value: "{{ knowpilot_domain }}"}
    - {key: KP_TLS, value: "{{ knowpilot_tls }}"}
    - {key: KP_OIDC_CA_BUNDLE, value: "{{ knowpilot_oidc_ca_bundle }}"}
  loop_control:
    label: "{{ item.key }}"

- name: Make the deployer reachable under a stable name
  # The unit files name /usr/local/bin/knowpilot-update, so they never have to
  # know where the checkout lives.
  ansible.builtin.file:
    src: "{{ knowpilot_directory }}/infra/server/update.sh"
    dest: /usr/local/bin/knowpilot-update
    state: link

- name: Install the systemd units
  ansible.builtin.copy:
    src: "{{ knowpilot_directory }}/infra/server/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    remote_src: true
    mode: "0644"
  loop:
    - knowpilot-update.service
    - knowpilot-update.timer
  notify: Reload systemd

- name: Check what the deployer would do, before letting it do it
  # A dry run on every provision: it reads the release, verifies the three
  # signatures, and changes nothing. If this fails, the timer would have
  # failed too - and finding out here is cheaper than finding out at 04:00.
  ansible.builtin.command: /usr/local/bin/knowpilot-update
  environment:
    KP_DRY_RUN: "1"
    KP_ENV_FILE: "{{ knowpilot_directory }}/.env.production"
  register: knowpilot_dry_run
  changed_when: false

- name: Show what it found
  ansible.builtin.debug:
    var: knowpilot_dry_run.stdout_lines

# Provisioning, not deployment: declarative, idempotent, and exactly what this
# playbook is for. It was a manual step in docs/deploy.md, and a manual step is
# a step that gets forgotten - this host ran for an hour with a login that
# answered 500 over a realm that was a 404.
- name: Create the realm and the BFF client
  ansible.builtin.command: infra/keycloak/setup-realm.sh
  args:
    chdir: "{{ knowpilot_directory }}"
  environment:
    KP_ENV_FILE: .env.production
    KP_COMPOSE_FILE: docker-compose.prod.yml
  register: knowpilot_realm
  # Before the first deployment Keycloak is not running and this cannot work.
  # That is not a failure of the playbook, so it says so and carries on.
  failed_when: false
  changed_when: knowpilot_realm.rc == 0
  # The script prints a generated client secret when the env file has none.
  # fill-secrets.sh has already put one there, so that branch does not run -
  # but an Ansible log is not the place to find out otherwise.
  no_log: true

- name: Say what to do when the realm could not be created
  ansible.builtin.debug:
    msg:
      - "Keycloak did not answer, so the realm was NOT created."
      - "Expected before the first deployment. Run this playbook again once"
      - "the timer has deployed, or the login answers 500 over a 404."
  when: knowpilot_realm.rc != 0

- name: Start the timer
  ansible.builtin.systemd_service:
    name: knowpilot-update.timer
    state: started
    enabled: true
    daemon_reload: true
