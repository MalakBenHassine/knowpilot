---
# Provision a machine to run KnowPilot, and leave it deploying itself.
#
#   ansible-playbook -i inventory.ini site.yml
#   ansible-playbook -i inventory.ini site.yml --check   # change nothing
#
# What is Ansible's job and what is not:
#
#   PROVISIONING - packages, users, firewall, services, unit files - is
#   declarative and belongs here. Running this twice changes nothing the
#   second time, and that is the whole value.
#
#   DEPLOYING is not. infra/server/update.sh runs every five minutes from a
#   systemd timer, verifies a signature and rolls back; Ansible is not on the
#   machine at that moment and should not be. This playbook installs the
#   deployer; it does not replace it.
#
# Secrets are GENERATED ON THE TARGET by infra/server/fill-secrets.sh. Nothing
# secret is templated from here, so no password ever exists on the control
# machine, in this repository, or in an Ansible log.

- name: Provision a KnowPilot host
  hosts: knowpilot
  become: true

  vars:
    knowpilot_repository: https://github.com/MalakBenHassine/knowpilot.git
    knowpilot_version: main
    knowpilot_directory: /opt/knowpilot
    knowpilot_registry: ghcr.io/malakbenhassine
    knowpilot_ip: "{{ ansible_facts['default_ipv4']['address'] | default('') }}"
    # sslip.io resolves a dashed address to that address, so a host with no DNS
    # entry still has a NAME - and a name is what a certificate is issued for.
    # Override with a real domain on a public server.
    knowpilot_domain: "knowpilot.{{ knowpilot_ip | replace('.', '-') }}.sslip.io"
    # A private address can never pass an ACME challenge: the challenge has to
    # reach this host from the internet. So Caddy signs with its own CA there,
    # and asks Let's Encrypt everywhere else. Deciding this from the address
    # beats asking the operator to remember which case they are in.
    knowpilot_tls: "{{ 'tls internal' if knowpilot_ip is match('^(10\\.|192\\.168\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)') else '' }}"
    # Set when, and only when, Caddy signs locally - the same condition because
    # it is the same fact. The API reaches Keycloak through the public url, so
    # a certificate nothing else trusts has to be handed to the one container
    # that must verify it. Without this the login returns 500 with
    # CERTIFICATE_VERIFY_FAILED while every health check passes.
    knowpilot_oidc_ca_bundle: "{{ '/ca-trust/root.crt' if knowpilot_tls else '' }}"
    cosign_version: v3.0.2
    cosign_sha256: 46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd
    # The API and the worker each hold the 2.2 GB embedding model.
    required_memory_mb: 6000
    # Total RAM is not the question - what is FREE is. A 7 GB host running
    # a JVM lab passes the total check and still gets OOM-killed.
    required_available_mb: 5500
    required_disk_gb: 20

  pre_tasks:
    - name: Read how much memory and disk this machine really has
      ansible.builtin.setup:
        gather_subset:
          - hardware

    - name: Refuse a machine that cannot hold the stack
      # Better a sentence now than an OOM kill in the middle of the first
      # deployment, which looks exactly like a broken release.
      ansible.builtin.assert:
        that:
          # default(0): a host that does not report its memory must get the
          # refusal sentence, not an undefined-variable traceback. Seen for
          # real - WSL returns no hardware facts at all.
          - ansible_facts['memtotal_mb'] | default(0) | int >= required_memory_mb | int
        fail_msg: >-
          This host reports {{ ansible_facts['memtotal_mb'] | default(0) }} MB of RAM - or did not
          report it at all - and the stack needs
          about {{ required_memory_mb }}. Give the machine more memory, or stop
          what is already using it, before running this again.
        success_msg: "{{ ansible_facts['memtotal_mb'] | default(0) }} MB of RAM: enough."

    - name: Refuse a machine whose memory is already spoken for
      # Found on a real host: 7372 MB total - so the check above passed - with
      # 1.9 GB actually available, because Nexus and SonarQube held 3 GB of
      # JVM heap. Total RAM says what the machine has; this says what is left.
      ansible.builtin.assert:
        that:
          - ansible_facts['memory_mb'].nocache.free | default(0) | int >= required_available_mb | int
        fail_msg: >-
          {{ ansible_facts['memory_mb'].nocache.free | default(0) }} MB of the
          {{ ansible_facts['memtotal_mb'] | default(0) }} MB
          on this host are free, and the stack needs about {{ required_available_mb }}.
          Something else is holding the rest. Find it with
          'ps -eo pid,rss,args --sort=-rss | head' and 'docker ps', stop it, and
          run this again.
        success_msg: "{{ ansible_facts['memory_mb'].nocache.free | default(0) }} MB free right now: enough."

    - name: Refuse a machine with no room for the images
      ansible.builtin.assert:
        that:
          # `| first | default(0)` rather than `| first`: a host whose root
          # mount Ansible cannot read is refused with the sentence below,
          # instead of dying on a Jinja error nobody can act on.
          - (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/')
             | map(attribute='size_available') | first | default(0) | int)
            > (required_disk_gb | int * 1024 * 1024 * 1024)
        fail_msg: >-
          Less than {{ required_disk_gb }} GB free on / - or no readable root
          mount at all. The three images and the model volume need about
          that much before anything starts.
        success_msg: "Enough free space on /."

    - name: Refuse a machine with no address of its own
      # Everything downstream is named after it: the domain, the certificate,
      # the issuer in every token. An empty one produces a stack that starts
      # and serves nothing.
      ansible.builtin.assert:
        that:
          - knowpilot_ip | length > 0
        fail_msg: >-
          This host reports no default IPv4 address, so there is nothing to
          name it after. Give it a route to a network, or set knowpilot_domain
          by hand, before running this again.
        success_msg: "{{ knowpilot_domain }} - certificate from {{ knowpilot_tls | default('ACME', true) }}"

  roles:
    - base
    - knowpilot

  post_tasks:
    - name: Say what to do next
      ansible.builtin.debug:
        msg:
          - "Provisioned. The timer checks for a new release every five minutes."
          - "Watch it:      journalctl -u knowpilot-update.service -f"
          - "Force a check: sudo systemctl start knowpilot-update.service"
          - "Preview only:  sudo KP_DRY_RUN=1 {{ knowpilot_directory }}/infra/server/update.sh"
