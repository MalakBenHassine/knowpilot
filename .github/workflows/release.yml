name: Release

# Builds the three production images ONCE, for x86 and ARM, and publishes them
# to GitHub's registry under the commit they were built from (ADR-0020). The
# server never builds: it pulls the exact bytes this workflow produced, so what
# runs in production is what CI built - not a rebuild that happens to share
# the same Dockerfile.
#
# ON A TAG, NOT ON EVERY PUSH. Releasing on `main` published images from
# commits whose tests had failed - the workflows run in parallel and this one
# never waited. Tagging is the decision: `main` is tested continuously, and a
# release says "this commit, the one I checked, is the one to ship".
#
#   git tag -a v0.3.0 -m "context window and subject check"
#   git push origin v0.3.0
#
# Nothing forces the tag onto a green commit - a machine cannot tell an
# accepted failure from an overlooked one. What changed is that publishing is
# now an act with a name on it, instead of a side effect of merging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One job per image and architecture, each on a NATIVE runner. Emulating ARM
  # with QEMU would run the whole dependency install - PyTorch included -
  # through an instruction translator, for tens of minutes.
  build:
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend, keycloak]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
          - image: keycloak
            context: infra/keycloak
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        # Registry paths must be lowercase; GitHub owners need not be.
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/knowpilot-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # Pushed by DIGEST, without a tag: the tag is written once, below, when
      # both architectures exist - so no one can ever pull a tag that points
      # at one architecture only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.image == 'frontend' && 'VITE_API_MODE=http' || '' }}
          outputs: type=image,name=${{ steps.name.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          # Per-image, per-architecture cache in GitHub's cache service: an
          # unchanged dependency layer is reused instead of reinstalled.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.runner }}
          # Supply chain: a signed record of how and from what the image was
          # built, and the list of what is inside it.
          provenance: mode=max
          sbom: true

      - name: Record the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # A pushed image is not a released image: the digests above carry no tag,
  # so nothing can pull them. Trivy reads them here, and the job below writes
  # the tags only if this one passes. THE TAG IS THE GATE, not the push.
  scan:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      # Every image is reported, not just the first to fail: one run, the
      # whole list of what has to be fixed.
      fail-fast: false
      matrix:
        image: [backend, frontend, keycloak]
        # Both architectures. A CVE can be in one architecture's packages and
        # not in the other's, and only one of them would reach the server.
        platform: [linux/amd64, linux/arm64]
        # The same mapping as the build job, because the artifact names
        # come from it.
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      # For .trivyignore.yaml: the accepted vulnerabilities live in the
      # repository, reviewed like any other file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build job writes one empty file whose NAME is the digest. Anything
      # other than exactly one means the artifact is not what we think it is,
      # and scanning the wrong image would be worse than not scanning.
      - name: The image to scan
        id: image
        run: |
          cd "${{ runner.temp }}/digests"
          files=(*)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one digest, found ${#files[@]}"
            exit 1
          fi
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/knowpilot-${{ matrix.image }}"
          echo "ref=$repository@sha256:${files[0]}" >> "$GITHUB_OUTPUT"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The build pushes provenance and an SBOM, so a digest names an
          # INDEX: the image for one architecture, plus attestation manifests
          # under `unknown/unknown`. Left to choose, Trivy looks for a child
          # matching the machine it runs on - and fails on every arm64 image
          # scanned from an x86 runner, which is how the first run of this
          # job ended. Saying which architecture removes the question.
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          # The same policy as the dependency scan in security.yml: a
          # vulnerability with no released fix cannot be fixed by upgrading,
          # and blocking on it only teaches everyone to bypass the gate.
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  # Joins the two architectures of each image into one multi-platform tag.
  publish:
    needs: [build, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this job's OIDC identity for a
      # short-lived certificate, so there is no private key to store, to
      # rotate, or to leak.
      id-token: write
    strategy:
      matrix:
        image: [backend, frontend, keycloak]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags. The full commit sha is immutable and is the value
      # KP_IMAGE_TAG takes on the server: rolling back is setting the previous
      # one. The release name (v0.3.0) is for humans, and is what the
      # signature identity below is bound to.
      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/knowpilot-${{ matrix.image }}"
          # shellcheck disable=SC2046  # the splitting is the point: one
          # @digest argument per architecture, which is what imagetools takes
          docker buildx imagetools create \
            --tag "$repository:$GITHUB_SHA" \
            --tag "$repository:$GITHUB_REF_NAME" \
            $(printf "$repository@sha256:%s " *)
          docker buildx imagetools inspect "$repository:$GITHUB_SHA"

      # Keyless signature, stored next to the image in the registry. It says
      # WHICH workflow, on which commit, produced these bytes. Whoever
      # controls the registry can replace an image; they cannot forge a
      # certificate issued by GitHub's OIDC provider.
      - name: Sign the image, then verify the signature
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/knowpilot-${{ matrix.image }}"
          # The digest of the manifest LIST - the multi-platform image the
          # tag now points at, not one of its two architectures.
          digest=$(docker buildx imagetools inspect "$repository:$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          cosign sign --yes "$repository@$digest"

          # Verified here, in the same job: a broken signing setup fails the
          # release instead of being discovered on the server, at deployment
          # time, by someone reading an error they have never seen.
          # The identity carries the ref that triggered this run, so a
          # verifier can tell a tagged release from a manual dispatch.
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify "$repository@$digest" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          echo "signed and verified: $repository@$digest"

  # A release is not a side effect either. This job writes the GitHub
  # Release, and it writes it ONLY after the three images are tagged and
  # signed - a release page that points at images nobody can pull is worse
  # than no release page.
  #
  # It also verifies the three signatures a second time, from a job that
  # signed nothing and holds no id-token. If an identity or a digest does
  # not hold up, the release is never written. So the notes below are not a
  # claim about the images: they are the output of checking them.
  announce:
    needs: publish
    # `workflow_dispatch` can run on a branch, where the ref is not a
    # version and there is no tag to release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The only job in this file that may write to the repository, and the
      # only thing it writes is the release.
      contents: write
      packages: read
    steps:
      # No checkout: this job reads the registry and calls the API. Nothing
      # it does needs a working copy.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve each tag, and verify its signature again
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"

          : > digests.md
          for image in backend frontend keycloak; do
            repository="ghcr.io/$owner/knowpilot-$image"
            # The digest of the manifest LIST the tag points at, which is
            # what was signed.
            digest=$(docker buildx imagetools inspect "$repository:$GITHUB_REF_NAME" \
              --format '{{.Manifest.Digest}}')
            cosign verify "$repository@$digest" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" > /dev/null
            echo "| \`$repository:$GITHUB_REF_NAME\` | \`$digest\` |" >> digests.md
            echo "verified $repository:$GITHUB_REF_NAME"
          done

      - name: Write the notes
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          # shellcheck disable=SC2016  # the backticks are markdown, and the
          # single quotes are what keeps them from being run
          {
            echo '## Images'
            echo
            echo 'Built once for `linux/amd64` and `linux/arm64`, scanned with'
            echo 'Trivy **before** the tag was written, signed with cosign, and'
            echo 'verified once more by the job that wrote this page.'
            echo
            echo '| Image | Digest of the multi-platform manifest |'
            echo '| --- | --- |'
            cat digests.md
            echo
            echo '### Check one before you pull it'
            echo
            echo '```bash'
            echo "cosign verify ghcr.io/$owner/knowpilot-backend:$GITHUB_REF_NAME \\"
            echo "  --certificate-identity $identity \\"
            echo '  --certificate-oidc-issuer https://token.actions.githubusercontent.com'
            echo '```'
            echo
            echo "Running them: [docs/deploy.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/deploy.md)"
          } > notes.md
          cat notes.md

      # The REST API rather than `gh release create`, for one documented
      # behaviour: with `generate_release_notes`, the body is PRE-PENDED to
      # the generated commit list. So the page carries both what was checked
      # and what changed, in one call.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="$GITHUB_REF_NAME" \
            -F generate_release_notes=true \
            -F body=@notes.md \
            --jq '.html_url'
