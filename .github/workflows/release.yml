name: Release

# Builds the three production images ONCE, for x86 and ARM, and publishes them
# to GitHub's registry under the commit they were built from (ADR-0020). The
# server never builds: it pulls the exact bytes this workflow produced, so what
# runs in production is what CI built - not a rebuild that happens to share
# the same Dockerfile.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One job per image and architecture, each on a NATIVE runner. Emulating ARM
  # with QEMU would run the whole dependency install - PyTorch included -
  # through an instruction translator, for tens of minutes.
  build:
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend, keycloak]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
          - image: keycloak
            context: infra/keycloak
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        # Registry paths must be lowercase; GitHub owners need not be.
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/knowpilot-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # Pushed by DIGEST, without a tag: the tag is written once, below, when
      # both architectures exist - so no one can ever pull a tag that points
      # at one architecture only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.image == 'frontend' && 'VITE_API_MODE=http' || '' }}
          outputs: type=image,name=${{ steps.name.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          # Per-image, per-architecture cache in GitHub's cache service: an
          # unchanged dependency layer is reused instead of reinstalled.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.runner }}
          # Supply chain: a signed record of how and from what the image was
          # built, and the list of what is inside it.
          provenance: mode=max
          sbom: true

      - name: Record the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # Joins the two architectures of each image into one multi-platform tag.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend, keycloak]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the full commit sha - immutable, and the value
      # KP_IMAGE_TAG takes on the server - and with `main`, a moving pointer
      # for humans. Deployments use the sha: rolling back is setting the
      # previous one.
      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/knowpilot-${{ matrix.image }}"
          docker buildx imagetools create \
            --tag "$repository:$GITHUB_SHA" \
            --tag "$repository:main" \
            $(printf "$repository@sha256:%s " *)
          docker buildx imagetools inspect "$repository:$GITHUB_SHA"
