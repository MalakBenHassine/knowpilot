[project]
name = "knowpilot-backend"
version = "0.1.0"
description = "KnowPilot API: authentication (BFF), document ingestion and grounded answers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "joserfc>=1.7.5",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.3.6,<0.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "redis>=6",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.54",
    "torch>=2.14.0",
    "tzdata>=2025.2",
]

# The application ships as a container and is never published to an index:
# there is no package to build.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F style and errors, I import order, B bugbear, UP modern syntax,
# S security (bandit), ASYNC async pitfalls.
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the whole point of a test file.
# S105: fake tokens in fixtures are not hardcoded credentials.
"tests/*" = ["S101", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# pgvector was pinned below 0.4 by langchain-postgres (ADR-0014), and those
# releases ship no type information. Scoped to that one package, so a missing
# stub anywhere else still fails the check.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.8",
]
# PyTorch ships one wheel per accelerator, and the default index serves the
# CUDA build: ~2.5 GB of GPU code that would never run on a CPU-only VM.
# `explicit` means this index is used *only* for the packages mapped to it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
