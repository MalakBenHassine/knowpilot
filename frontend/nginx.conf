# Static serving for the single-page application.
#
# This server does NOT proxy /api. The edge proxy in front of the stack routes
# / here and /api to the backend, so the browser sees ONE origin - which the
# session design requires: a `__Host-` cookie is only sent same-origin, and a
# split origin would mean CORS, credentials in a cross-site request, and a
# cookie the browser refuses to set.

server {
    # 8080, not 80: ports below 1024 require root on Linux, and this image
    # runs as an unprivileged user. Binding low ports is a privilege we do not
    # need, so we do not take it.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser is asked to compress; nginx does it on the fly. Not for
    # images or fonts, which are already compressed - re-compressing them
    # spends CPU to produce a slightly larger file.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite writes /assets/index-a1b2c3.js: the content hash is IN the filename.
    # A changed file is therefore a different URL, so the old one can be cached
    # for a year without any risk of serving a stale build.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else falls back to index.html, because the routes of a single
    # page application exist only in the browser. Without this, reloading
    # /documents asks nginx for a file that was never written, and the user
    # gets a 404 on a page that works when reached by clicking.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must NEVER be cached: it is the file that names the
        # hashed bundles. A cached one keeps pointing at the previous deploy,
        # and the user stays on the old version until they clear their cache.
        add_header Cache-Control "no-cache" always;

        # These are repeated rather than declared once at server level, and
        # the repetition is deliberate. `add_header` does not merge: a block
        # that declares any header inherits NONE from its parent. Writing them
        # once above and once here would silently drop them from whichever
        # location adds its own - a classic way to lose security headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Kubernetes and Compose need something cheap to poll that does not touch
    # the filesystem or write a log line every few seconds.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }
}
