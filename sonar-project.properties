# SonarQube Cloud analysis of the whole monorepo, run by
# .github/workflows/sonar.yml. The project key and organization come from
# sonarcloud.io; the rest of this file is what the scanner cannot guess.

sonar.projectKey=MalakBenHassine_knowpilot
sonar.organization=malakbenhassine
sonar.projectName=KnowPilot
sonar.sourceEncoding=UTF-8

# Backend and frontend hold their tests in different places - the backend in
# a tests/ directory, the frontend beside the code it tests. So both roots are
# declared, and the inclusions below decide what is production code and what
# is test code. Anything matching sonar.test.inclusions is a test.
sonar.sources=.
sonar.tests=.
sonar.inclusions=backend/app/**,backend/scripts/**,frontend/src/**
sonar.test.inclusions=backend/tests/**,backend/evals/**,frontend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Dependencies, build output and caches are not our code.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/__pycache__/**,**/coverage/**

# Alembic writes the migrations; consecutive migrations legitimately repeat
# the same boilerplate. They stay analysed for bugs - only the duplication
# detector is told to ignore them.
sonar.cpd.exclusions=backend/alembic/versions/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
